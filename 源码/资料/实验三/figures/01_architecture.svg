<text x="48" y="147" font-size="19" fill="#22d3ee" style="fill:#22d3ee" text-anchor="start" font-weight="700">输入图谱与关系序列</text>
<text x="48" y="172" font-size="14" fill="#cbd5e1" style="fill:#cbd5e1" text-anchor="start" font-weight="400">2—4 跳问题 / 终点公开谓词</text>
<text x="48" y="194" font-size="14" fill="#cbd5e1" style="fill:#cbd5e1" text-anchor="start" font-weight="400">实体、真实边与证据属性</text>
<rect x="365" y="118" width="295" height="91" rx="7" fill="#0f172a"/>
<rect x="365" y="118" width="295" height="91" rx="7" fill="#16283a" stroke="#a78bfa" stroke-width="1.5"/>
